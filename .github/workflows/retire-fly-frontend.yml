name: Retire Fly Frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-fly-frontend.yml'

jobs:
  scale-down:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scale frontend to zero
        run: flyctl scale count 0 --app sabr-frontend-prod --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
